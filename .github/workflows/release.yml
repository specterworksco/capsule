name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - bun.lock
      - apps/cli/**
      - packages/shared/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      should_release: ${{ steps.package.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "Root package.json must define a version" >&2
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: capsule-linux-x64
            target: bun-linux-x64
            binary: apps/cli/dist/capsule-linux-x64
            asset: capsule-linux-x64
          - artifact: capsule-linux-x64-baseline
            target: bun-linux-x64-baseline
            binary: apps/cli/dist/capsule-linux-x64-baseline
            asset: capsule-linux-x64-baseline
          - artifact: capsule-linux-x64-modern
            target: bun-linux-x64-modern
            binary: apps/cli/dist/capsule-linux-x64-modern
            asset: capsule-linux-x64-modern
          - artifact: capsule-linux-arm64
            target: bun-linux-arm64
            binary: apps/cli/dist/capsule-linux-arm64
            asset: capsule-linux-arm64
          - artifact: capsule-linux-x64-musl
            target: bun-linux-x64-musl
            binary: apps/cli/dist/capsule-linux-x64-musl
            asset: capsule-linux-x64-musl
          - artifact: capsule-linux-arm64-musl
            target: bun-linux-arm64-musl
            binary: apps/cli/dist/capsule-linux-arm64-musl
            asset: capsule-linux-arm64-musl
          - artifact: capsule-macos-x64
            target: bun-darwin-x64
            binary: apps/cli/dist/capsule-macos-x64
            asset: capsule-macos-x64
          - artifact: capsule-macos-x64-baseline
            target: bun-darwin-x64-baseline
            binary: apps/cli/dist/capsule-macos-x64-baseline
            asset: capsule-macos-x64-baseline
          - artifact: capsule-macos-arm64
            target: bun-darwin-arm64
            binary: apps/cli/dist/capsule-macos-arm64
            asset: capsule-macos-arm64
          - artifact: capsule-windows-x64
            target: bun-windows-x64
            binary: apps/cli/dist/capsule-windows-x64.exe
            asset: capsule-windows-x64.exe
          - artifact: capsule-windows-x64-baseline
            target: bun-windows-x64-baseline
            binary: apps/cli/dist/capsule-windows-x64-baseline.exe
            asset: capsule-windows-x64-baseline.exe
          - artifact: capsule-windows-x64-modern
            target: bun-windows-x64-modern
            binary: apps/cli/dist/capsule-windows-x64-modern.exe
            asset: capsule-windows-x64-modern.exe
          - artifact: capsule-windows-arm64
            target: bun-windows-arm64
            binary: apps/cli/dist/capsule-windows-arm64.exe
            asset: capsule-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Compile CLI
        run: bun run --cwd apps/cli compile -- ${{ matrix.target }} ${{ matrix.asset }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.binary }}" "release/${{ matrix.asset }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - version
      - build
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" release/* \
            --title "Capsule $VERSION" \
            --notes "Capsule $VERSION binaries."

  already-released:
    name: Version already released
    needs: version
    if: needs.version.outputs.should_release == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Skip release
        run: echo "${{ needs.version.outputs.tag }} already exists; no release will be created."
